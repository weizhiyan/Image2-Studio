<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Studio</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero panel">
        <div class="hero-grid">
          <div>
            <div class="eyebrow">GPT Image · Agent Skills · Local Memory</div>
            <h1>把想法变成有气场的图。</h1>
            <p>一句话、一个比例、一次点击。Agent 会记住你的审美偏好，让下一张更贴近你。</p>
          </div>
          <button id="configOpenButton" class="status-card" type="button">
            <span id="providerDot" class="dot"></span>
            <div>
              <strong id="providerText">检查配置中</strong>
              <small id="agentText">Agent 状态检测中</small>
            </div>
          </button>
        </div>
      </section>

      <section class="workspace">
        <form id="generateForm" class="composer panel">
          <label class="field-label" for="promptInput">你的画面</label>
          <div class="prompt-shell">
            <textarea id="promptInput" placeholder="例：一张高级黑金风格的 AI 产品海报，主体是发光的玻璃立方体，电影级布光，强烈纵深感..." required></textarea>
            <button id="optimizePromptButton" class="prompt-magic-button" type="button" title="优化提示词" aria-label="优化提示词">
              <svg class="prompt-magic-icon" viewBox="0 0 1024 1024" aria-hidden="true">

              </svg>
            </button>
          </div>

          <div id="dropZone" class="drop-zone" tabindex="0">
            <input id="fileInput" type="file" accept="image/*" multiple hidden />
            <div>
              <strong>拖拽 / 点击上传参考图</strong>
              <span>也可以直接 Ctrl+V 粘贴截图</span>
            </div>
          </div>

          <div id="attachmentList" class="attachment-list"></div>
          <div id="referenceModeHint" class="reference-mode-hint">未添加参考图：本次将重新生成</div>

          <div class="controls">
            <button id="ratioButton" class="ratio-button" type="button" aria-haspopup="dialog">
              <span>生成比例</span>
              <strong id="ratioLabel">自动</strong>
            </button>
            <div id="ratioMenu" class="ratio-menu" hidden>
              <button class="ratio-menu-item active" type="button" data-size="auto" data-label="自动">自动 · 按参考图判断</button>
              <button class="ratio-menu-item" type="button" data-size="1024x1024" data-label="1:1">1:1 · 头像 / 产品图</button>
              <button class="ratio-menu-item" type="button" data-size="1536x864" data-label="16:9">16:9 · 横版海报 / 封面</button>
              <button class="ratio-menu-item" type="button" data-size="864x1536" data-label="9:16">9:16 · 手机壁纸 / 竖版</button>
              <button class="ratio-menu-item" type="button" data-size="1536x1024" data-label="3:2">3:2 · 摄影 / Banner</button>
              <button class="ratio-menu-item" type="button" data-size="1024x1536" data-label="2:3">2:3 · 人物 / 插画</button>
            </div>
            <input id="sizeSelect" type="hidden" value="auto" />
          </div>

          <button id="generateButton" class="primary-button" type="submit">生成图像</button>
          <div id="jobStatus" class="job-status">准备就绪</div>
          <div id="loadingStage" class="loading-stage" hidden>
            <span class="loader-orb"></span>
            <div>
              <strong id="loadingTitle">正在生成</strong>
              <small id="loadingHint">灵感正在聚焦成画面...</small>
            </div>
          </div>
        </form>

        <section class="panel results-panel">
          <div class="section-head">
            <div>
              <span class="eyebrow">Outputs</span>
              <h2>生成结果</h2>
            </div>
          </div>
          <div id="resultLoading" class="result-loading" hidden>
            <div class="capybaraloader" aria-hidden="true">
              <div class="capybara">
                <div class="capyhead">
                  <div class="capyear"><div class="capyear2"></div></div>
                  <div class="capyear"></div>
                  <div class="capymouth">
                    <div class="capylips"></div>
                    <div class="capylips"></div>
                  </div>
                  <div class="capyeye"></div>
                  <div class="capyeye"></div>
                </div>
                <div class="capyleg"></div>
                <div class="capyleg2"></div>
                <div class="capyleg2"></div>
                <div class="capy"></div>
              </div>
              <div class="capy-loader"><div class="capy-loaderline"></div></div>
            </div>
            <strong id="resultLoadingTitle">正在生成图像</strong>
            <small id="resultLoadingHint">画面正在从光影里浮出来...</small>
          </div>
          <div id="resultsGrid" class="results-grid empty">结果会出现在这里</div>
        </section>
      </section>

      <section class="history panel">
        <div class="section-head">
          <div>
            <span class="eyebrow">Archive</span>
            <h2>历史作品</h2>
          </div>
          <button id="refreshHistory" class="ghost-button" type="button">刷新</button>
        </div>
        <div id="historyList" class="history-list empty">暂无历史图像</div>
        <button id="loadMoreHistory" class="load-more-button" type="button" hidden>加载更多历史作品</button>
      </section>
    </main>

    <div id="previewModal" class="modal" hidden>
      <button id="closePreview" class="modal-close" type="button">×</button>
      <img id="previewImage" alt="预览图" />
      <div id="previewFeedback" class="preview-feedback" hidden>
        <button class="feedback-button" type="button" data-feedback="like" aria-label="喜欢">👍</button>
        <button class="feedback-button" type="button" data-feedback="dislike" aria-label="不喜欢">👎</button>
      </div>
      <div id="previewMeta" class="preview-meta"></div>
    </div>

    <div id="configModal" class="modal config-modal" hidden>
      <form id="configForm" class="config-dialog panel">
        <div class="section-head">
          <div>
            <span class="eyebrow">Model Config</span>
            <h2>模型配置</h2>
          </div>
          <button id="closeConfig" class="ghost-button" type="button">关闭</button>
        </div>
        <div class="config-grid">
          <label>图像 Base URL<input id="imageProviderBase" name="imageProviderBase" placeholder="https://api.openai.com/v1" /></label>
          <label>图像 API Key<input id="imageProviderApiKey" name="imageProviderApiKey" type="password" placeholder="留空表示不修改" /></label>
          <label>图像模型名<input id="imageProviderModel" name="imageProviderModel" placeholder="gpt-image-2" /></label>
          <label>Provider 名称<input id="imageProviderName" name="imageProviderName" placeholder="openai-compatible" /></label>
          <label>语言 Base URL<input id="languageModelBase" name="languageModelBase" placeholder="https://api.openai.com/v1" /></label>
          <label>语言 API Key<input id="languageModelApiKey" name="languageModelApiKey" type="password" placeholder="留空表示不修改" /></label>
          <label>语言模型名<input id="languageModelName" name="languageModelName" placeholder="gpt-4.1-mini" /></label>
        </div>
        <button class="primary-button" type="submit">保存配置</button>
        <div id="configStatus" class="job-status">保存后立即生效，无需重启。</div>
      </form>
    </div>

    <script src="./js/app.js"></script>
  </body>
</html>
